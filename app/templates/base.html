<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OpsTrack{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <nav class="nav"><a class="brand" href="{{ url_for('main.index') }}"><span>O</span> OpsTrack</a><a class="button small" href="{{ url_for('main.create_incident') }}">+ New incident</a></nav>
  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer>OpsTrack · Incident tracking for reliable operations</footer>
</body>
</html>
