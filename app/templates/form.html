{% extends 'base.html' %}
{% block title %}{{ action }} incident · OpsTrack{% endblock %}
{% block content %}<div class="page-head"><p class="eyebrow">INCIDENT MANAGEMENT</p><h1>{{ action }} incident</h1><p>Capture clear details so the response team can act quickly.</p></div>
<form class="card form" method="post"><label>Incident title<input name="title" maxlength="120" required value="{{ incident.title or '' }}" placeholder="e.g. Checkout API returning 503"></label><label>Affected service<input name="service" maxlength="80" required value="{{ incident.service or '' }}" placeholder="e.g. checkout-api"></label><div class="form-row"><label>Severity<select name="severity">{% for severity in severities %}<option {% if incident.severity == severity %}selected{% endif %}>{{ severity }}</option>{% endfor %}</select></label><label>Status<select name="status">{% for status in statuses %}<option {% if incident.status == status %}selected{% endif %}>{{ status }}</option>{% endfor %}</select></label></div><label>Description<textarea name="description" rows="7" required placeholder="Describe the impact, symptoms, and known context...">{{ incident.description or '' }}</textarea></label><div class="actions"><a class="button secondary" href="{{ url_for('main.index') }}">Cancel</a><button class="button" type="submit">{{ action }} incident</button></div></form>{% endblock %}
