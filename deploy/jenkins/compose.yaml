services:
  docker:
    image: docker:dind
    privileged: true
    restart: unless-stopped
    command:
      - --storage-driver
      - overlay2
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - jenkins_docker_certs:/certs/client
      - jenkins_data:/var/jenkins_home
    networks:
      jenkins:
        aliases:
          - docker

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: opstrack-jenkins:2.568.3
    restart: unless-stopped
    depends_on:
      - docker
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_CERT_PATH: /certs/client
      DOCKER_TLS_VERIFY: "1"
      JAVA_OPTS: -Xms256m -Xmx1024m
    ports:
      - "8080:8080"
    volumes:
      - jenkins_data:/var/jenkins_home
      - jenkins_docker_certs:/certs/client:ro
    networks:
      - jenkins

volumes:
  jenkins_data:
  jenkins_docker_certs:

networks:
  jenkins:
