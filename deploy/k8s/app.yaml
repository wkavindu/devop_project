apiVersion: apps/v1
kind: Deployment
metadata:
  name: opstrack
  namespace: opstrack
spec:
  replicas: 2
  selector:
    matchLabels:
      app: opstrack
  template:
    metadata:
      labels:
        app: opstrack
    spec:
      containers:
        - name: opstrack
          image: wkavindu/opstrack:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: opstrack-secrets
                  key: SECRET_KEY
            - name: MONGO_URI
              value: mongodb://mongo:27017/
            - name: MONGO_DB_NAME
              value: opstrack
            - name: MONGO_TIMEOUT_MS
              value: "2000"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: opstrack
  namespace: opstrack
spec:
  selector:
    app: opstrack
  ports:
    - name: http
      port: 80
      targetPort: http
      